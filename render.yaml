services:
  - type: web
    name: quiz-portal
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXTAUTH_SECRET
        generateValue: true # signs login cookies
      - key: DATABASE_URL
        sync: false # Supabase "Session pooler" connection string; enter it in the Render dashboard
