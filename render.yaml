services:
  - type: web
    name: quiz-portal
    runtime: node
    plan: starter # persistent disks need a paid plan
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXTAUTH_SECRET
        generateValue: true # signs login cookies
      - key: DATA_DIR
        value: /var/data # accounts, quizzes and results are saved here
    disk:
      name: quiz-data
      mountPath: /var/data
      sizeGB: 1
